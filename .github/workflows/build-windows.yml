name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_core.py
      - run: python -m PyInstaller --noconfirm --windowed --onefile --name StockPhotoSorter --icon assets/icon.ico --add-data "assets;assets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StockPhotoSorter-windows
          path: dist/StockPhotoSorter.exe
